name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  Test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create Cache Timestamp
        id: cache_timestamp
        uses: nanzm/get-time-action@v2.0
        with:
          format: 'YYYY-MM-DD-HH-mm-ss'
      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: "~/.cache/bazel"
          key: bazelcache_test_${{ steps.cache_timestamp.outputs.time }}
          restore-keys: bazelcache_test_
      - name: Test
        run: |
          export CC=gcc-13
          export CXX=g++-13
          bazel test --noshow_progress --keep_going ...
  MacOsBuild:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: |
          bazel test --noshow_progress --keep_going ...
      - name: Build
        run: |
          bazel build --noshow_progress -c opt //fpga:fpga-as
  ClangTidy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Dependencies
        run: |
          sudo apt-get install clang-tidy-18
      - name: Create Cache Timestamp
        id: cache_timestamp
        uses: nanzm/get-time-action@v2.0
        with:
          format: 'YYYY-MM-DD-HH-mm-ss'
      - name: Mount clang-tidy cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/clang-tidy
            ~/.cache/bazel
          key: clang-tidy-cache_${{ steps.cache_timestamp.outputs.time }}
          restore-keys: clang-tidy-cache_
      - name: Build Compilation DB
        run: |
          scripts/make-compilation-db.sh
      - name: Run clang-tidy
        run: |
          clang-tidy-18 --version
          CLANG_TIDY=clang-tidy-18 scripts/run-clang-tidy-cached.cc \
            || ( cat fpga-assembler_clang-tidy.out ; exit 1)
  NixCheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: |
          nix flake check
  NixBuild:
    # Pushing to the cachix binary cache needs CACHIX_AUTH_TOKEN, which GitHub
    # does not expose to pull requests from forks. Only build and push the
    # cache on push/merge to main, never on external PRs.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: fpga-assembler
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build
        run: |
          nix build --no-link --print-out-paths
      # Defensive: only push when a token is actually present. The job above
      # already restricts this to push-to-main (where the secret exists), but
      # this keeps the push steps safe if the trigger is ever widened.
      - name: Push flake inputs to cachix
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        run: |
          nix flake archive --json \
            | jq -r '.path,(.inputs|to_entries[].value.path)' \
            | cachix push fpga-assembler
      - name: Push build output to cachix
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        run: |
          nix build --no-link --print-out-paths \
            | cachix push fpga-assembler

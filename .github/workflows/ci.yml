name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  Test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create Cache Timestamp
        id: cache_timestamp
        uses: nanzm/get-time-action@v2.0
        with:
          format: 'YYYY-MM-DD-HH-mm-ss'
      - name: Mount bazel cache
        uses: actions/cache@v6
        with:
          path: "~/.cache/bazel"
          key: bazelcache_test_${{ steps.cache_timestamp.outputs.time }}
          restore-keys: bazelcache_test_
      - name: Test
        run: |
          export CC=gcc-13
          export CXX=g++-13
          bazel test --noshow_progress --keep_going ...
  MacOsBuild:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test
        run: |
          bazel test --noshow_progress --keep_going ...
      - name: Build
        run: |
          bazel build --noshow_progress -c opt //fpga:fpga-as
  ClangTidy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Dependencies
        run: |
          sudo apt-get install clang-tidy-18
      - name: Create Cache Timestamp
        id: cache_timestamp
        uses: nanzm/get-time-action@v2.0
        with:
          format: 'YYYY-MM-DD-HH-mm-ss'
      - name: Mount clang-tidy cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/clang-tidy
            ~/.cache/bazel
          key: clang-tidy-cache_${{ steps.cache_timestamp.outputs.time }}
          restore-keys: clang-tidy-cache_
      - name: Build Compilation DB
        run: |
          scripts/make-compilation-db.sh
      - name: Run clang-tidy
        run: |
          clang-tidy-18 --version
          CLANG_TIDY=clang-tidy-18 scripts/run-clang-tidy-cached.cc \
            || ( cat fpga-assembler_clang-tidy.out ; exit 1)
  # Building and pushing the nix package to the cachix binary cache happens
  # in the cachix workflow, which only runs on push to main.
  NixCheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: |
          nix flake check
